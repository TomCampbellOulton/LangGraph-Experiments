[project]
name = "test-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TomCampbellOulton", email = "tcampbelloulton@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "langchain-huggingface>=1.2.2",
    "langchain[openai]>=1.3.14",
    "langgraph>=1.2.11",
    "numpy>=2.2.6",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "transformers>=5.15.0",
]

[project.scripts]
test-project = "test_project:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

# Uses the CPU version of torch since we're only using torch on the agent for inference (doesn't need much processing)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true